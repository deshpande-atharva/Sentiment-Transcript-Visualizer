name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Must match the npm that resolved package-lock.json (see frontend/Dockerfile).
      - name: Pin npm
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:ci

      - name: Production build
        # Placeholder values only; no secrets are needed to verify the build.
        env:
          CI: true
          REACT_APP_BACKEND_URL: http://localhost:8000
          REACT_APP_DEEPGRAM_API_KEY: ci-placeholder
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate compose configuration
        env:
          ANTHROPIC_API_KEY: ci-placeholder
          REACT_APP_DEEPGRAM_API_KEY: ci-placeholder
        run: docker compose config --quiet

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: sentiment-aura-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: sentiment-aura-frontend:ci
          build-args: |
            REACT_APP_BACKEND_URL=http://localhost:8000
            REACT_APP_DEEPGRAM_API_KEY=ci-placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify backend container serves its health endpoint
        run: |
          docker run -d --name backend-smoke -p 8000:8000 \
            -e ANTHROPIC_API_KEY=ci-placeholder sentiment-aura-backend:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/ | grep -q "Backend is running"; then
              echo "backend healthy"; exit 0
            fi
            sleep 2
          done
          echo "backend never became healthy"; docker logs backend-smoke; exit 1

      - name: Verify frontend container serves the built bundle
        run: |
          docker run -d --name frontend-smoke -p 8080:8080 sentiment-aura-frontend:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/healthz | grep -q "ok"; then
              curl -fsS http://localhost:8080/ | grep -q "<div id=\"root\">" \
                && echo "frontend healthy" && exit 0
            fi
            sleep 2
          done
          echo "frontend never became healthy"; docker logs frontend-smoke; exit 1

      - name: Tear down smoke containers
        if: always()
        run: docker rm -f backend-smoke frontend-smoke || true
