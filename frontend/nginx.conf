server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Container health probe - served without touching the SPA bundle.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # CRA emits content-hashed filenames under /static, so they are safe to pin.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached or clients keep booting a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
